# TEMPORANEO: esplorazione dei dati ISTAT dai server di GitHub (da cancellare a fine lavori)
name: Esplora ISTAT (temporaneo)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  esplora:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 esplora.py
      - name: Salva
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add esplora_out
          git commit -m "Esplorazione ISTAT (temporaneo)" || echo nulla
          git pull --rebase -q
          git push
